name: Mobile check

on:
  pull_request:
    paths:
      - 'mobile/**'

permissions:
  contents: read

jobs:
  mobile-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Supabase URL normalizer tests
        run: npm run test:normalize-supabase-url

      - name: Export Android bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npx expo export --platform android
