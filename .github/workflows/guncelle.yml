name: Günlük Fiyat Güncelleme

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: '7,27,47 * * * *'  # UTC; :00/:17 yoğunluğundan kaçınır
    - cron: '10 5 * * *'  # Sabah TR (~08:10) sessiz saat kuyrugu ve beklenen degisim
  push:
    branches:
      - main
  workflow_dispatch:       # Elle de çalıştırılabilir

    inputs:
      test_notification:
        description: Hedef cihaza test bildirimi gonder
        required: false
        default: false
        type: boolean
      test_installation_id:
        description: Test bildiriminin hedef installation_id degeri
        required: false
        default: ''
        type: string

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: guncelle-price-update
      cancel-in-progress: false

    steps:
      - name: Zamanlanmış koşu — freshness gate uygulanacak mı?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "10 5 * * *" ]; then
            echo "use_freshness_gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_freshness_gate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate için minimal checkout
        if: steps.gate.outputs.use_freshness_gate == 'true'
        uses: actions/checkout@v4
        with:
          path: .gate
          sparse-checkout: |
            backend/schedule_freshness.py
          sparse-checkout-cone-mode: false

      - name: Zamanlanmış koşu — veri taze mi?
        if: steps.gate.outputs.use_freshness_gate == 'true'
        id: freshness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 .gate/backend/schedule_freshness.py

      - name: Atlandı (fiyatlar güncel)
        if: steps.gate.outputs.use_freshness_gate == 'true' && steps.freshness.outputs.skip == 'true'
        run: echo "Scraper atlandi; fiyatlar yeterince guncel."

      - name: Bekleyen bildirim kuyruğu (scraper atlandı)
        if: steps.gate.outputs.use_freshness_gate == 'true' && steps.freshness.outputs.skip == 'true'
        uses: actions/checkout@v4

      - name: Python kur (kuyruk flush)
        if: steps.gate.outputs.use_freshness_gate == 'true' && steps.freshness.outputs.skip == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri kur (kuyruk flush)
        if: steps.gate.outputs.use_freshness_gate == 'true' && steps.freshness.outputs.skip == 'true'
        run: pip install -r backend/requirements.txt

      - name: Sessiz saat sonrası bekleyen push kuyruğunu gönder
        if: steps.gate.outputs.use_freshness_gate == 'true' && steps.freshness.outputs.skip == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/notification_pending_flush.py

      - name: Kodu çek
        if: steps.gate.outputs.use_freshness_gate != 'true' || steps.freshness.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Python kur
        if: steps.gate.outputs.use_freshness_gate != 'true' || steps.freshness.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri kur
        if: steps.gate.outputs.use_freshness_gate != 'true' || steps.freshness.outputs.skip != 'true'
        run: pip install -r backend/requirements.txt

      - name: Fiyatları güncelle
        if: steps.gate.outputs.use_freshness_gate != 'true' || steps.freshness.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEND_TEST_NOTIFICATION: ${{ inputs.test_notification }}
          TEST_NOTIFICATION_INSTALLATION_ID: ${{ inputs.test_installation_id }}
        run: python backend/fiyat_servisi.py

  guncelle-schedule-alert:
    runs-on: ubuntu-latest
    needs: guncelle
    if: ${{ failure() && github.event_name == 'schedule' }}
    permissions:
      issues: write
    steps:
      - name: Planlı koşu hatası için issue aç veya güncelle
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Scheduled guncelle workflow failed';
            const body = [
              'A scheduled `Günlük Fiyat Güncelleme` run failed.',
              '',
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Time (UTC): ${new Date().toISOString()}`,
              '',
              'Check the job log for scrape, notification, or setup errors.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 20,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another failure:\n\n${body}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
