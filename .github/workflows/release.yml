name: GitHub Release (Android APK)

# v* tag'i push edildiğinde production ortam değişkenleriyle imzalı APK üretir
# ve GitHub Release'e APK + SHA256SUMS.txt olarak ekler.
# Tetikleme: git tag v1.0.18 && git push origin v1.0.18

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.12.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Doğrulama — tag / sürüm / release preflight
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "HATA: tag=$TAG_VERSION, app.json=$APP_VERSION — sürümleri eşitleyin."
            exit 1
          fi
          NOTES="../docs/RELEASE_NOTES/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "HATA: sürüm notu eksik: $NOTES"
            exit 1
          fi
          node scripts/release-preflight.mjs

      - name: EAS production APK build
        id: eas_build
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile release \
            --non-interactive \
            --wait \
            --json > eas-build.json

          BUILD_JSON=$(jq -c '(if type == "array" then .[0] else . end)' eas-build.json)
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.id // empty')
          APK_URL=$(echo "$BUILD_JSON" | jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty')
          STATUS=$(echo "$BUILD_JSON" | jq -r '.status // empty')

          echo "EAS build: $BUILD_ID ($STATUS)"
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "HATA: EAS build APK bağlantısı döndürmedi (build=$BUILD_ID, status=$STATUS)."
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: APK indir ve SHA-256 üret
        id: apk
        env:
          APK_URL: ${{ steps.eas_build.outputs.apk_url }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APK_NAME="yakitradar-${TAG}.apk"
          curl --fail --location --retry 3 --retry-delay 5 --output "$APK_NAME" "$APK_URL"

          if ! file "$APK_NAME" | grep -qi 'android'; then
            echo "HATA: indirilen dosya APK görünmüyor."
            file "$APK_NAME"
            exit 1
          fi

          sha256sum "$APK_NAME" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — Yakıt Radar
          body_path: docs/RELEASE_NOTES/${{ github.ref_name }}.md
          files: |
            mobile/yakitradar-${{ github.ref_name }}.apk
            mobile/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        env:
          TAG: ${{ github.ref_name }}
          BUILD_ID: ${{ steps.eas_build.outputs.build_id }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
        run: |
          {
            echo "## GitHub Release: $TAG"
            echo ""
            echo "- EAS build: \`$BUILD_ID\`"
            echo "- APK: \`$APK_NAME\`"
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
