name: EAS Web Preview

on:
  push:
    branches:
      - cursor/zifiri-siyah-dark-redesign-e06e
      - cursor/redesign-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-web-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.12.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Pull EAS preview environment variables
        run: |
          set -euo pipefail
          eas env:pull preview --non-interactive --path .env --environment preview > /tmp/eas-env-pull.log 2>&1
          echo "Loaded preview environment variables into .env (values not logged)."
          rm -f /tmp/eas-env-pull.log

      - name: Export web bundle
        run: npx expo export --platform web

      - name: Resolve preview alias
        id: preview_alias
        run: |
          case "${GITHUB_REF_NAME}" in
            cursor/redesign-v2) echo "alias=yeniden-tasarim" >> "$GITHUB_OUTPUT" ;;
            *) echo "alias=zifiri-siyah" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Deploy preview to EAS Hosting
        id: eas_deploy
        env:
          DEPLOY_JSON_PATH: /tmp/eas-deploy.json
          PREVIEW_ALIAS: ${{ steps.preview_alias.outputs.alias }}
        run: |
          set -euo pipefail
          eas deploy \
            --non-interactive \
            --json \
            --environment preview \
            --alias "$PREVIEW_ALIAS" \
            --export-dir dist \
            > "$DEPLOY_JSON_PATH"

          DEPLOY_URL=$(jq -r '
            (if type == "array" then .[0] else . end)
            | .url // .deploymentUrl // .previewUrl // .hostname // empty
          ' "$DEPLOY_JSON_PATH")

          if [ -z "$DEPLOY_URL" ] || [ "$DEPLOY_URL" = "null" ]; then
            DEPLOY_URL=$(jq -r '
              (if type == "array" then .[0] else . end)
              | .deployments[0].url // .deployment.url // empty
            ' "$DEPLOY_JSON_PATH")
          fi

          if [ -z "$DEPLOY_URL" ] || [ "$DEPLOY_URL" = "null" ]; then
            echo "Could not parse deployment URL from EAS deploy JSON." >&2
            jq 'keys' "$DEPLOY_JSON_PATH" >&2 || true
            exit 1
          fi

          case "$DEPLOY_URL" in
            http://*|https://*) ;;
            *) DEPLOY_URL="https://${DEPLOY_URL}" ;;
          esac

          ALIAS_URL=$(jq -r --arg alias "$PREVIEW_ALIAS" '
            (if type == "array" then .[0] else . end)
            | .aliasUrl // .alias // empty
            | if . == "" then empty else . end
          ' "$DEPLOY_JSON_PATH")

          if [ -z "$ALIAS_URL" ] || [ "$ALIAS_URL" = "null" ]; then
            SLUG=$(jq -r '.expo.slug' app.json)
            ALIAS_URL="https://${SLUG}--${PREVIEW_ALIAS}.expo.app"
          fi

          case "$ALIAS_URL" in
            http://*|https://*) ;;
            *) ALIAS_URL="https://${ALIAS_URL}" ;;
          esac

          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "alias_url=${ALIAS_URL}" >> "$GITHUB_OUTPUT"
          rm -f "$DEPLOY_JSON_PATH"

      - name: Job summary
        env:
          ALIAS_URL: ${{ steps.eas_deploy.outputs.alias_url }}
          DEPLOY_URL: ${{ steps.eas_deploy.outputs.deploy_url }}
          GIT_REF: ${{ github.ref_name }}
        run: |
          {
            echo "## EAS Web preview deployment"
            echo ""
            echo "Branch: \`$GIT_REF\`"
            echo ""
            echo "**Stable preview URL (alias):** $ALIAS_URL"
            echo ""
            echo "**This deployment URL:** $DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"
